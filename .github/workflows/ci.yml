name: CI

# The old workflow built an image and deployed it to infrastructure that is long inactive. This one only
# checks the code: nothing is built, pushed or deployed, and it needs no secrets.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      # The server and the training worker need Redis, S3, SQS and Consul to run, so the check that can
      # run anywhere is that every file compiles.
      - name: Compile every Python file
        run: python -m compileall -q bin concierge test
